spring.application.name=example-api-hateoas
server.port=8081

# Spring Data REST: todos los repositorios cuelgan de /api (explorador HAL en /api/explorer)
spring.data.rest.base-path=/api
spring.data.rest.default-page-size=20

# Base de datos en memoria para el ejemplo. Para MariaDB/PostgreSQL basta con cambiar
# spring.datasource.* y añadir el driver.
spring.datasource.url=jdbc:h2:mem:examples
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# JWT. La clave es solo para desarrollo: en producción definir APP_JWT_SECRET (Base64, mínimo 32 bytes).
app.jwt.issuer=example-api-hateoas
app.jwt.secret=${APP_JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Njc4OTA=}
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=60m

management.endpoints.web.exposure.include=health,info
